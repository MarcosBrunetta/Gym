<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tracker" />
  <meta name="theme-color" content="#0A0A0F" />
  <title>Progress Tracker</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body, #root { height: 100%; }
    body { background: #0A0A0F; color: #E8E8F0; font-family: 'DM Mono', 'Courier New', monospace; overscroll-behavior: none; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #0A0A0F; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    button:focus-visible, input:focus-visible { outline: 2px solid #6B8EFF; outline-offset: 2px; }
    @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastIn { from { opacity:0; transform:translateX(110%); } to { opacity:1; transform:translateX(0); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes pulseDot { 0%,100% { opacity:1; } 50% { opacity:0.25; } }
    .slide-up { animation: slideUp 0.3s ease both; }
    .toast-anim { animation: toastIn 0.3s ease; }
    .fade-in { animation: fadeIn 0.25s ease; }
    .pulse-dot { animation: pulseDot 1.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .slide-up, .toast-anim, .fade-in, .pulse-dot { animation: none; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const C = {
  bg: "#0A0A0F", card: "#111", border: "#1a1a1a",
  text: "#E8E8F0", muted: "#555", dim: "#333",
};

// ─── RUTINA ACTUALIZADA SEGÚN PDF (2026-09-15) ───────────────────────
// optional: true → ejercicio opcional, no cuenta para el progreso de sesión obligatorio
const ROUTINE = {
  "Upper A": {
    day: "Upper A", color: "#FF6B35",
    exercises: [
      { id:"ua2", name:"Press inclinado con mancuernas banco 30°",           sets:3, reps:"10-12", iw:30,   unit:"kg/manc",  type:"comp" },
      { id:"ua3", name:"Jalón al pecho con barra recta agarre falso prono medio", sets:3, reps:"10-12", iw:17, unit:"discos", type:"comp" },
      { id:"ua4", name:"Fondos inclinado en C con codos abiertos en paralelas lastrados", sets:3, reps:"10-12", iw:2.5, unit:"kg disco", type:"comp" },
      { id:"ua5", name:"Remo en barra T agarre en V invertido",              sets:3, reps:"10-12", iw:65,   unit:"kg total", type:"comp" },
      { id:"ub1", name:"Elevaciones laterales en V bilateral cruzado sentado en banco 45° mirando a la polea en polea baja", sets:4, reps:"15-20", iw:2, unit:"discos", type:"aisl" },
      { id:"ub7", name:"Pájaros en V bilateral cruzado pecho apoyado en banco 45° en polea baja con cable agarre prono", sets:4, reps:"15-20", iw:1, unit:"discos", type:"aisl" },
      { id:"abs1", name:"Crunch con cuerda en polea alta",                   sets:3, reps:"15-20", iw:16,   unit:"discos",   type:"aisl" },
    ]
  },
  "Lower A": {
    day: "Lower A", color: "#4ECDC4",
    exercises: [
      { id:"la2", name:"Prensa de piernas inclinada", sets:3, reps:"10-12", iw:200, unit:"kg total", type:"comp" },
      { id:"la5", name:"Hip thrust con barra recta",  sets:3, reps:"10-12", iw:50,  unit:"kg total", type:"comp" },
      { id:"la4", name:"Extensión de cuádriceps en máquina",                 sets:3, reps:"10-12", iw:11,    unit:"discos",   type:"aisl" },
      { id:"la3", name:"Curl femoral sentado en máquina",                    sets:3, reps:"10-12", iw:16,    unit:"discos",   type:"aisl" },
      { id:"la1", name:"Elevación de gemelos parado con barra recta",        sets:4, reps:"15-20", iw:160,   unit:"kg total", type:"aisl" },
      { id:"la6", name:"Curl inclinado con mancuernas banco 45°",            sets:3, reps:"10-12", iw:20,    unit:"kg/manc",  type:"aisl" },
      { id:"la7", name:"Extensión overhead con barra recta banco 45° polea baja", sets:3, reps:"10-12", iw:12, unit:"discos", type:"aisl" },
      { id:"ub1x", name:"Elevaciones laterales en V bilateral cruzado sentado en banco 45° mirando a la polea en polea baja", sets:2, reps:"15-20", iw:2, unit:"discos", type:"aisl" },
    ]
  },
  "Upper B": {
    day: "Upper B", color: "#A855F7",
    exercises: [
      { id:"ua2", name:"Press inclinado con mancuernas banco 30°",           sets:3, reps:"10-12", iw:30,   unit:"kg/manc",  type:"comp" },
      { id:"ub3", name:"Pullover con barra recta banco 45° polea alta",     sets:3, reps:"10-12", iw:15,  unit:"discos",   type:"comp" },
      { id:"ub2", name:"Press plano con mancuernas",                        sets:3, reps:"10-12", iw:30,   unit:"kg/manc",  type:"comp" },
      { id:"ua5", name:"Remo en barra T agarre en V invertido",              sets:3, reps:"10-12", iw:65,   unit:"kg total", type:"comp" },
      { id:"ub1", name:"Elevaciones laterales en V bilateral cruzado sentado en banco 45° mirando a la polea en polea baja", sets:4, reps:"15-20", iw:2, unit:"discos", type:"aisl" },
      { id:"ub7", name:"Pájaros en V bilateral cruzado pecho apoyado en banco 45° en polea baja con cable agarre prono", sets:4, reps:"15-20", iw:1, unit:"discos", type:"aisl" },
      { id:"abs1", name:"Crunch con cuerda en polea alta",                   sets:3, reps:"15-20", iw:16,   unit:"discos",   type:"aisl" },
    ]
  },
  "Lower B": {
    day: "Lower B", color: "#F59E0B",
    exercises: [
      { id:"la2", name:"Prensa de piernas inclinada", sets:3, reps:"10-12", iw:200, unit:"kg total", type:"comp" },
      { id:"la5", name:"Hip thrust con barra recta",  sets:3, reps:"10-12", iw:50,  unit:"kg total", type:"comp" },
      { id:"lb4", name:"Extensión de cuádriceps en máquina",                 sets:3, reps:"10-12", iw:11,    unit:"discos",   type:"aisl" },
      { id:"lb3", name:"Curl femoral sentado en máquina",                    sets:3, reps:"10-12", iw:16,    unit:"discos",   type:"aisl" },
      { id:"lb1", name:"Elevación de gemelos sentado con barra recta",       sets:4, reps:"15-20", iw:155,   unit:"kg total", type:"aisl" },
      { id:"lb6", name:"Curl araña con mancuernas banco 45°",                sets:3, reps:"10-12", iw:17.5,  unit:"kg/manc",  type:"aisl" },
      { id:"lb7", name:"Extensión pushdown con barra recta banco 45° polea alta", sets:3, reps:"10-12", iw:12, unit:"discos", type:"aisl" },
      { id:"ub1x", name:"Elevaciones laterales en V bilateral cruzado sentado en banco 45° mirando a la polea en polea baja", sets:2, reps:"15-20", iw:2, unit:"discos", type:"aisl" },
    ]
  }
};

const DAYS = ["Upper A","Lower A","Upper B","Lower B"];

// ─── INCREMENTO DE SOBRECARGA PROGRESIVA POR UNIDAD ───────────────────
// Cada unidad de carga sube de a un escalón distinto: kg reales suben de
// a 2,5 kg; "discos" (pin de polea/máquina selectorizada) sube de a 1;
// máquinas con lectura en kg suben de a 5 (escalones más grandes típicos).
const UNIT_INCREMENTS = {
  "kg/manc": 2.5,
  "kg total": 2.5,
  "kg disco": 2.5,
  "kg máq": 5,
  "discos": 1,
};

// Tipos de peso válidos para editar dentro de la app (mismas claves que arriba).
const VALID_UNITS = Object.keys(UNIT_INCREMENTS);

function incFor(ex) {
  return UNIT_INCREMENTS[ex.unit] ?? 2.5;
}

function setsCountFor(ex, deload) {
  // Durante la semana de descarga las series bajan a 2 para todos los
  // ejercicios (y no hay sobrecarga progresiva esa semana), según el plan.
  return deload ? 2 : ex.sets;
}

// ─── DESCARGA ───────────────────────────────────────────────────────────
// Cada 4 semanas: bajar el peso de trabajo un 50%, sin sobrecarga progresiva
// esa semana, según indica el plan.
const DELOAD_FACTOR = 0.5;

function deloadWeightFor(weight) {
  return Math.round(weight * DELOAD_FACTOR * 100) / 100;
}

function ls(k, def) { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : def; } catch { return def; } }
function lss(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }

// ─── NAMESPACING DE CLAVES ──────────────────────────────────────────────
// localStorage se comparte por dominio completo, no por carpeta/proyecto:
// si esta página vive en marcosbrunetta.github.io/Gym, cualquier otra app
// alojada en el MISMO dominio (marcosbrunetta.github.io/OtroProyecto) lee y
// escribe el mismo localStorage. Las claves cortas tipo "ft_weights" corrían
// riesgo real de chocar con otra app. Se migran una sola vez a un prefijo
// específico de este proyecto; si ya existe la clave nueva no se vuelve a
// migrar, y si no existe pero sí la vieja "ft_*", se copia el valor una vez.
const NS = "gymTrackerMB_";
["weights","week","session","overrides","routine_version"].forEach(name => {
  const newKey = NS + name, oldKey = "ft_" + name;
  try {
    if (localStorage.getItem(newKey) === null) {
      const old = localStorage.getItem(oldKey);
      if (old !== null) localStorage.setItem(newKey, old);
    }
  } catch {}
});

function topRep(reps) { const parts = String(reps).split("-"); return parseInt(parts[parts.length-1], 10) || 0; }

// Aplica una personalización manual (nombre/tipo) sobre el ejercicio base de ROUTINE.
// Si no hay override para ese id, devuelve la MISMA referencia de ex sin cambios
// (importante para que el React.memo de ExerciseCard no re-renderice de más).
function withOverrides(ex, overrides) {
  const o = overrides[ex.id];
  return o ? { ...ex, ...o } : ex;
}

function initWeights() {
  const w = {};
  Object.values(ROUTINE).forEach(r => r.exercises.forEach(e => { w[e.id] = e.iw; }));
  return w;
}

// ─── VERSIÓN DE RUTINA ────────────────────────────────────────────────
// Subí este string cada vez que cambies ejercicios, orden, ids o valores
// iniciales (iw/unit) en ROUTINE. Si no coincide con la guardada, se
// recalculan los pesos: los ids listados en RESET_ON_VERSION_BUMP vuelven
// al valor del plan (porque su iw o su unidad cambiaron y el peso guardado
// ya no tiene sentido), y el resto conserva el progreso de sobrecarga
// acumulado tal cual estaba. Esto evita perder semanas de progreso en
// ejercicios que no cambiaron solo por corregir uno o dos puntuales.
const ROUTINE_VERSION = "2026-09-15";

// Ids que requieren reseteo forzado en esta revisión: "la6" y "lb6" se
// intercambian de ejercicio entre sí (misma unidad, kg/manc, así que sin
// reseteo el peso guardado de uno se mostraría como si fuera del otro):
// - "la6" pasa de ser "Curl araña con mancuernas banco 45°" (17,5 kg/manc)
//   a "Curl inclinado con mancuernas banco 45°" (20 kg/manc) en Lower A.
// - "lb6" pasa de ser "Curl inclinado con mancuernas banco 45°" (20 kg/manc)
//   a "Curl araña con mancuernas banco 45°" (17,5 kg/manc) en Lower B.
//
// El resto de los cambios de esta revisión no requieren reseteo forzado
// porque los ids afectados son nuevos, se eliminan, o mantienen su peso
// vigente sin cambiar de unidad:
// - Se agrega "Hip thrust con barra recta" (id nuevo "la5", 50 kg total),
//   compartido entre Lower A y Lower B.
// - "Elevaciones laterales en V ... sentado en banco 90° en polea baja"
//   (2 discos) queda unificado bajo los ids ya existentes "ub1" (4 series,
//   Upper A y Upper B) y "ub1x" (2 series, Lower A y Lower B); antes en
//   Upper A este ejercicio era otro (mancuernas, id "ua1", que desaparece).
// - Upper B suma "Press inclinado" (ua2), "Remo en barra T" (ua5), "Pájaros"
//   (ub7) y "Crunch con cuerda" (abs1), y saca "Remo sentado en polea baja",
//   "Cruces en polea baja" y "Rueda abdominal con lastre".
// - Upper A cambia "Face pull" por "Pájaros" (ub7, comparte id con Upper B).
// - "Fondos inclinado en C..." (ua4) corrige su peso inicial a 2,5 kg el disco.
// - Se sacan los ejercicios de curl femoral duplicados en Lower A y Lower B.
const RESET_ON_VERSION_BUMP = ["la6", "lb6"];

function loadWeights() {
  const storedVersion = ls("gymTrackerMB_routine_version", null);
  const stored = ls("gymTrackerMB_weights", null);
  if (storedVersion === ROUTINE_VERSION) return stored || initWeights();

  const fresh = initWeights();
  if (!stored) return fresh;

  const merged = { ...fresh };
  Object.keys(fresh).forEach(id => {
    if (!RESET_ON_VERSION_BUMP.includes(id) && typeof stored[id] === "number") {
      merged[id] = stored[id];
    }
  });
  return merged;
}

// ─── SET LOG MODAL ────────────────────────────────────────────────────
function LogModal({ ex, setIdx, color, currentWeight, onConfirm, onClose }) {
  const [weight, setWeight] = useState(String(currentWeight));
  const [reps, setReps] = useState("");
  const repsRef = useRef(null);
  useEffect(() => { setTimeout(() => repsRef.current?.focus(), 100); }, []);

  const repsNum = parseInt(reps, 10);
  const repsValid = Number.isInteger(repsNum) && repsNum > 0;

  const confirm = () => { if (!repsValid) return; onConfirm(parseFloat(weight)||0, repsNum); };

  return React.createElement("div", {
    className:"fade-in",
    onClick: onClose,
    role: "dialog",
    "aria-modal": true,
    "aria-label": `Registrar serie ${setIdx+1} de ${ex.name}`,
    style:{ position:"fixed", inset:0, zIndex:200, background:"rgba(0,0,0,0.88)", display:"flex", alignItems:"flex-end", justifyContent:"center" }
  },
    React.createElement("div", {
      onClick: e => e.stopPropagation(),
      className:"slide-up",
      style:{ background:"#141414", borderRadius:"20px 20px 0 0", padding:"24px 20px 40px",
        width:"100%", maxWidth:"480px", borderTop:`3px solid ${color}` }
    },
      React.createElement("p", { style:{ fontSize:10, color:C.muted, letterSpacing:"0.25em", marginBottom:4 } },
        `SERIE ${setIdx+1} · ${ex.type === "comp" ? "COMPUESTO" : "AISLADO"}`),
      React.createElement("p", { style:{ fontSize:13, color:"#ddd", marginBottom:22, lineHeight:1.4 } }, ex.name),
      React.createElement("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 } },
        React.createElement("div", null,
          React.createElement("label", { style:{ fontSize:9, color:C.muted, letterSpacing:"0.2em", display:"block", marginBottom:6 } }, `PESO (${ex.unit})`),
          React.createElement("input", {
            type:"number", value:weight, inputMode:"decimal",
            onChange: e => setWeight(e.target.value),
            "aria-label": `Peso en ${ex.unit}`,
            style:{ width:"100%", padding:"12px 8px", borderRadius:8, fontSize:22,
              fontFamily:"'Bebas Neue',sans-serif", background:"#1c1c1c",
              border:`1.5px solid ${color}55`, color:color, textAlign:"center", outline:"none" }
          })
        ),
        React.createElement("div", null,
          React.createElement("label", { style:{ fontSize:9, color:C.muted, letterSpacing:"0.2em", display:"block", marginBottom:6 } }, `REPS (${ex.reps})`),
          React.createElement("input", {
            ref: repsRef, type:"number", value:reps, inputMode:"numeric",
            onChange: e => setReps(e.target.value),
            onKeyDown: e => e.key==="Enter" && confirm(),
            "aria-label": `Repeticiones realizadas, rango objetivo ${ex.reps}`,
            style:{ width:"100%", padding:"12px 8px", borderRadius:8, fontSize:22,
              fontFamily:"'Bebas Neue',sans-serif", background:"#1c1c1c",
              border: reps && !repsValid ? "1.5px solid #f59e0b" : "1.5px solid #2a2a2a", color:"#fff", textAlign:"center", outline:"none" }
          })
        )
      ),
      React.createElement("button", {
        onClick: confirm,
        disabled: !repsValid,
        "aria-label": "Confirmar serie",
        style:{ width:"100%", padding:14, borderRadius:10, fontSize:11,
          letterSpacing:"0.3em", textTransform:"uppercase",
          background:color, color:"#000", border:"none",
          cursor: repsValid ? "pointer" : "not-allowed", opacity: repsValid ? 1 : 0.4,
          fontFamily:"inherit", fontWeight:600, transition:"opacity 0.15s" }
      }, "CONFIRMAR SERIE")
    )
  );
}

// ─── EXERCISE CARD ────────────────────────────────────────────────────
const ExerciseCard = React.memo(function ExerciseCard({ ex, color, weight, sessionLog, completedSets, onLogSet, onUndoSet, onEditWeight, onEditName, onToggleType, onEditUnit, deload }) {
  const sets = setsCountFor(ex, deload);
  const setsArr = Array.from({ length: sets }, (_, i) => i);
  const allDone = setsArr.every(i => completedSets[`${ex.id}-${i}`]);
  // En descarga se muestra (y se registra) el 50% del peso de trabajo, sin
  // tocar el peso base guardado — al terminar la semana de descarga, el peso
  // de trabajo completo vuelve solo, tal como estaba antes de bajarlo.
  const displayWeight = deload ? deloadWeightFor(weight) : weight;

  return React.createElement("div", {
    style:{
      background: allDone ? "#0c1a0c" : C.card,
      border:`1px solid ${allDone ? "#1e3a1e" : C.border}`,
      borderRadius:12, padding:"13px 14px", transition:"all 0.3s"
    }
  },
    React.createElement("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10 } },
      React.createElement("div", { style:{ flex:1, paddingRight:10 } },
        React.createElement("div", { style:{ display:"flex", alignItems:"center", gap:6, marginBottom:4 } },
          React.createElement("button", {
            onClick: () => onToggleType(ex),
            "aria-label": `Tipo: ${ex.type==="comp" ? "compuesto" : "aislado"}. Tocar para cambiar a ${ex.type==="comp" ? "aislado" : "compuesto"}`,
            style:{ fontSize:8, padding:"2px 6px", borderRadius:4, letterSpacing:"0.1em", border:"none", cursor:"pointer", fontFamily:"inherit",
              background: ex.type==="comp" ? "#15153a" : "#1a1a1a",
              color: ex.type==="comp" ? "#6B8EFF" : C.muted }
          }, ex.type==="comp" ? "COMPUESTO" : "AISLADO"),
          ex.optional && React.createElement("span", {
            style:{ fontSize:8, padding:"2px 6px", borderRadius:4, letterSpacing:"0.1em",
              background:"#1a1505", color:"#caa23a" }
          }, "OPCIONAL"),
          allDone && React.createElement("span", { style:{ fontSize:11, color:"#4ade80" } }, "✓")
        ),
        React.createElement("button", {
          onClick: () => onEditName(ex),
          "aria-label": `Editar nombre de ${ex.name}`,
          style:{ display:"flex", alignItems:"baseline", gap:5, background:"none", border:"none", padding:0,
            textAlign:"left", cursor:"pointer", fontFamily:"inherit", width:"100%" }
        },
          React.createElement("p", { style:{ fontSize:12, color: allDone ? "#4ade80" : "#ccc", lineHeight:1.4 } }, ex.name),
          React.createElement("span", { style:{ fontSize:9, color:"#444", flexShrink:0 } }, "✎")
        )
      ),
      React.createElement("div", { style:{ textAlign:"right", flexShrink:0, display:"flex", flexDirection:"column", alignItems:"flex-end" } },
        React.createElement("button", {
          onClick: () => onEditWeight(ex),
          "aria-label": `Editar peso de ${ex.name}, actual ${displayWeight} ${ex.unit}${deload ? " (descarga, -50%)" : ""}`,
          style:{ background:"none", border:"none", padding:0,
            cursor:"pointer", display:"flex", alignItems:"baseline", gap:4, fontFamily:"inherit" }
        },
          React.createElement("p", { style:{ fontFamily:"'Bebas Neue',sans-serif", fontSize:22, color, lineHeight:1 } }, displayWeight),
          React.createElement("span", { style:{ fontSize:9, color:"#444" } }, "✎")
        ),
        React.createElement("button", {
          onClick: () => onEditUnit(ex),
          "aria-label": `Editar tipo de peso de ${ex.name}, actual ${ex.unit}`,
          style:{ background:"none", border:"none", padding:0, marginTop:1,
            cursor:"pointer", display:"flex", alignItems:"center", gap:3, fontFamily:"inherit" }
        },
          React.createElement("span", { style:{ fontSize:8, color:"#3a3a3a", letterSpacing:"0.1em" } }, ex.unit),
          React.createElement("span", { style:{ fontSize:7, color:"#333" } }, "✎")
        )
      )
    ),
    React.createElement("div", { style:{ display:"flex", gap:6, alignItems:"center", flexWrap:"wrap" } },
      React.createElement("span", { style:{ fontSize:9, color:"#3a3a3a", letterSpacing:"0.12em" } }, ex.reps+" rep"),
      ...setsArr.map(i => {
        const key = `${ex.id}-${i}`;
        const done = completedSets[key];
        const logData = sessionLog[key];
        return React.createElement("button", {
          key:i,
          onClick: () => done ? onUndoSet(ex.id, i) : onLogSet(ex, i),
          "aria-label": done
            ? `Deshacer serie ${i+1} de ${ex.name}, registrada con ${logData?.reps} repeticiones y ${logData?.weight} ${ex.unit}`
            : `Registrar serie ${i+1} de ${ex.name}`,
          style:{
            width:46, height:38, borderRadius:7, fontSize:9,
            border: done ? "none" : `1px solid #252525`,
            background: done ? color : "#181818",
            color: done ? "#000" : C.muted, cursor:"pointer",
            display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
            lineHeight:1.2, fontFamily:"inherit", transition:"all 0.15s"
          }
        },
          done
            ? [React.createElement("span", { key:"r", style:{ fontSize:11, fontWeight:600 } }, logData?.reps),
               React.createElement("span", { key:"w", style:{ fontSize:7 } }, logData?.weight)]
            : React.createElement("span", { key:"s", style:{ letterSpacing:"0.1em" } }, `S${i+1}`)
        );
      })
    )
  );
}, (prev, next) => {
  if (prev.ex !== next.ex || prev.color !== next.color || prev.weight !== next.weight || prev.deload !== next.deload) return false;
  if (prev.onLogSet !== next.onLogSet || prev.onUndoSet !== next.onUndoSet || prev.onEditWeight !== next.onEditWeight) return false;
  if (prev.onEditName !== next.onEditName || prev.onToggleType !== next.onToggleType || prev.onEditUnit !== next.onEditUnit) return false;
  const sets = setsCountFor(next.ex, next.deload);
  for (let i = 0; i < sets; i++) {
    const k = `${next.ex.id}-${i}`;
    if (!!prev.completedSets[k] !== !!next.completedSets[k]) return false;
    const a = prev.sessionLog[k], b = next.sessionLog[k];
    if ((a && a.reps) !== (b && b.reps)) return false;
    if ((a && a.weight) !== (b && b.weight)) return false;
  }
  return true;
});

// ─── ERROR BOUNDARY ───────────────────────────────────────────────────
// Si algo falla durante el render, React por defecto desmonta toda la app
// y queda una pantalla negra sin ningún mensaje. Este boundary muestra el
// error real en pantalla para poder diagnosticarlo, en vez de solo ver
// "todo negro".
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("Tracker crash:", error, info); }
  handleReset() {
    try { localStorage.removeItem("gymTrackerMB_session"); } catch {}
    window.location.reload();
  }
  render() {
    if (!this.state.error) return this.props.children;
    return React.createElement("div", {
      style:{ minHeight:"100vh", background:C.bg, color:"#f59e0b", padding:20,
        fontFamily:"'DM Mono',monospace", fontSize:12, lineHeight:1.6 }
    },
      React.createElement("p", { style:{ fontSize:16, marginBottom:10, color:"#fff" } }, "⚠️ Se produjo un error"),
      React.createElement("p", { style:{ marginBottom:16, color:"#f59e0b", whiteSpace:"pre-wrap", wordBreak:"break-word" } },
        String(this.state.error && (this.state.error.stack || this.state.error.message || this.state.error))),
      React.createElement("button", {
        onClick: () => this.handleReset(),
        style:{ padding:"10px 16px", borderRadius:8, background:"#f59e0b", color:"#000",
          border:"none", fontFamily:"inherit", fontSize:11, letterSpacing:"0.1em", cursor:"pointer" }
      }, "REINICIAR SESIÓN Y RECARGAR")
    );
  }
}

// ─── MAIN APP ─────────────────────────────────────────────────────────
function App() {
  const [weights, setWeights] = useState(loadWeights);
  const [weekNum, setWeekNum] = useState(() => ls("gymTrackerMB_week", 1));
  const [activeDay, setActiveDay] = useState(() => {
    const stored = ls("gymTrackerMB_session", null)?.activeDay;
    // Si el día guardado ya no existe en la rutina actual (por ejemplo,
    // "Upper A" de una rutina anterior), se cae a un valor válido en vez de
    // romper el render.
    return (stored && ROUTINE[stored]) ? stored : "Upper A";
  });
  const [sessionLog, setSessionLog] = useState(() => ls("gymTrackerMB_session", null)?.sessionLog || {});
  const [completedSets, setCompletedSets] = useState(() => ls("gymTrackerMB_session", null)?.completedSets || {});
  // Personalizaciones manuales por ejercicio: nombre y/o tipo (comp/aisl), guardadas
  // aparte de ROUTINE para que editar dentro de la app no requiera tocar código.
  // Forma: { [exerciseId]: { name?: string, type?: "comp" | "aisl" } }
  const [overrides, setOverrides] = useState(() => ls("gymTrackerMB_overrides", {}));
  const [logging, setLogging] = useState(null);
  const [toast, setToast] = useState(null);

  const showToast = useCallback((msg, type="ok") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  }, []);

  const storageWarnedRef = useRef(false);
  const persistOrWarn = useCallback((ok, msg) => {
    if (!ok) {
      if (!storageWarnedRef.current) { storageWarnedRef.current = true; showToast(msg, "warn"); }
    } else {
      storageWarnedRef.current = false;
    }
  }, [showToast]);

  useEffect(() => {
    const ok = lss("gymTrackerMB_weights", weights) && lss("gymTrackerMB_routine_version", ROUTINE_VERSION);
    persistOrWarn(ok, "⚠️ No se pudo guardar el progreso (¿modo privado o memoria llena?)");
  }, [weights, persistOrWarn]);

  useEffect(() => {
    persistOrWarn(lss("gymTrackerMB_overrides", overrides), "⚠️ No se pudo guardar las personalizaciones de ejercicios");
  }, [overrides, persistOrWarn]);

  useEffect(() => { lss("gymTrackerMB_week", weekNum); }, [weekNum]);

  useEffect(() => {
    persistOrWarn(
      lss("gymTrackerMB_session", { activeDay, sessionLog, completedSets }),
      "⚠️ No se pudo guardar la sesión en curso"
    );
  }, [activeDay, sessionLog, completedSets, persistOrWarn]);

  const weightsRef = useRef(weights);
  useEffect(() => { weightsRef.current = weights; }, [weights]);

  const isDeload = weekNum % 4 === 0;
  const dayColor = ROUTINE[activeDay].color;
  const exercises = useMemo(
    () => ROUTINE[activeDay].exercises.map(ex => withOverrides(ex, overrides)),
    [activeDay, overrides]
  );

  const requiredExercises = exercises.filter(e => !e.optional);
  const allSets = requiredExercises.reduce((a,e) => a + setsCountFor(e, isDeload), 0);
  const doneSets = requiredExercises.reduce((sum, e) => {
    const setsForEx = setsCountFor(e, isDeload);
    let count = 0;
    for (let i = 0; i < setsForEx; i++) {
      if (completedSets[`${e.id}-${i}`]) count++;
    }
    return sum + count;
  }, 0);
  const pct = allSets > 0 ? Math.round(doneSets/allSets*100) : 0;

  const handleLogSet = useCallback((ex, setIdx) => {
    setLogging({ ex, setIdx, exId: ex.id });
  }, []);

  const handleUndoSet = useCallback((exId, setIdx) => {
    const key = `${exId}-${setIdx}`;
    setCompletedSets(prev => { if (!(key in prev)) return prev; const n = { ...prev }; delete n[key]; return n; });
    setSessionLog(prev => { if (!(key in prev)) return prev; const n = { ...prev }; delete n[key]; return n; });
  }, []);

  const handleEditWeight = useCallback((ex) => {
    const current = weightsRef.current[ex.id];
    const input = window.prompt(`Nuevo peso — ${ex.name} (${ex.unit})`, current);
    if (input === null) return;
    const val = parseFloat(String(input).replace(",", "."));
    if (!Number.isFinite(val) || val < 0) { showToast("⚠️ Peso inválido", "warn"); return; }
    const rounded = Math.round(val * 100) / 100;
    setWeights(prev => ({ ...prev, [ex.id]: rounded }));
    showToast(`✎ Peso actualizado: ${rounded} ${ex.unit}`);
  }, [showToast]);

  const handleEditName = useCallback((ex) => {
    const input = window.prompt(`Nuevo nombre del ejercicio`, ex.name);
    if (input === null) return;
    const trimmed = input.trim();
    if (!trimmed) { showToast("⚠️ El nombre no puede quedar vacío", "warn"); return; }
    setOverrides(prev => ({ ...prev, [ex.id]: { ...prev[ex.id], name: trimmed } }));
    showToast(`✎ Nombre actualizado`);
  }, [showToast]);

  const handleToggleType = useCallback((ex) => {
    const next = ex.type === "comp" ? "aisl" : "comp";
    setOverrides(prev => ({ ...prev, [ex.id]: { ...prev[ex.id], type: next } }));
    showToast(`✎ Tipo actualizado: ${next === "comp" ? "Compuesto" : "Aislado"}`);
  }, [showToast]);

  const handleEditUnit = useCallback((ex) => {
    const input = window.prompt(`Tipo de peso — opciones: ${VALID_UNITS.join(" / ")}`, ex.unit);
    if (input === null) return;
    const trimmed = input.trim();
    const match = VALID_UNITS.find(u => u.toLowerCase() === trimmed.toLowerCase());
    if (!match) { showToast(`⚠️ Tipo inválido. Usá: ${VALID_UNITS.join(" / ")}`, "warn"); return; }

    setOverrides(prev => ({ ...prev, [ex.id]: { ...prev[ex.id], unit: match } }));

    // Si cambia la unidad, el número guardado deja de tener sentido en la
    // escala nueva (ej: "14 discos" no es lo mismo que "14 kg/manc"), así que
    // de una se pide el peso correspondiente en la unidad nueva.
    if (match !== ex.unit) {
      const current = weightsRef.current[ex.id];
      const weightInput = window.prompt(`Peso actual en ${match}`, current);
      if (weightInput !== null) {
        const val = parseFloat(String(weightInput).replace(",", "."));
        if (Number.isFinite(val) && val >= 0) {
          setWeights(prev => ({ ...prev, [ex.id]: Math.round(val * 100) / 100 }));
        }
      }
    }
    showToast(`✎ Tipo de peso actualizado: ${match}`);
  }, [showToast]);

  const confirmLog = (weight, reps) => {
    if (!logging) return;
    const repsNum = Math.trunc(reps);
    if (!Number.isFinite(repsNum) || repsNum <= 0) { showToast("⚠️ Ingresá una cantidad de reps válida", "warn"); return; }

    const key = `${logging.exId}-${logging.setIdx}`;
    setSessionLog(prev => ({ ...prev, [key]: { weight, reps: repsNum } }));
    setCompletedSets(prev => ({ ...prev, [key]: true }));

    if (!isDeload && logging.setIdx === 0 && repsNum >= topRep(logging.ex.reps)) {
      const inc = incFor(logging.ex);
      if (inc > 0) {
        const newW = parseFloat((weight + inc).toFixed(2));
        setWeights(prev => ({ ...prev, [logging.exId]: newW }));
        showToast(`💪 ¡Sobrecarga! Nuevo peso: ${newW} ${logging.ex.unit}`, "progress");
      }
    }

    setLogging(null);
  };

  const finishWorkout = () => {
    if (Object.keys(sessionLog).length === 0) {
      showToast("⚠️ Registrá al menos una serie antes de guardar", "warn");
      return;
    }
    setSessionLog({});
    setCompletedSets({});
    showToast("✅ Entrenamiento guardado");
  };

  const changeDay = d => { setActiveDay(d); setSessionLog({}); setCompletedSets({}); };

  return React.createElement("div", {
    style:{ minHeight:"100vh", background:C.bg, position:"relative", overflow:"hidden" }
  },
    // BG grid
    React.createElement("div", { style:{
      position:"fixed", inset:0, zIndex:0,
      backgroundImage:`linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px)`,
      backgroundSize:"40px 40px", pointerEvents:"none"
    }}),
    // Accent glow
    React.createElement("div", { style:{
      position:"fixed", top:-120, right:-120, width:380, height:380,
      background:`radial-gradient(circle,${dayColor}1a 0%,transparent 70%)`,
      zIndex:0, transition:"background 0.5s", pointerEvents:"none"
    }}),

    // Scrollable content
    React.createElement("div", {
      style:{ position:"relative", zIndex:1, maxWidth:480, margin:"0 auto",
        padding:`env(safe-area-inset-top,16px) 16px 40px`, minHeight:"100vh", overflowY:"auto" }
    },

      // ── HEADER ──
      React.createElement("div", { style:{ marginBottom:22, paddingTop:8 } },
        React.createElement("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" } },
          React.createElement("div", null,
            React.createElement("p", { style:{ fontSize:9, letterSpacing:"0.35em", color:C.muted, textTransform:"uppercase", marginBottom:3 } },
              `SEMANA ${weekNum}${isDeload ? " · 🔄 DESCARGA" : ""}`
            ),
            React.createElement("h1", { style:{ fontFamily:"'Bebas Neue',sans-serif", fontSize:40, letterSpacing:"0.05em", color:"#fff", lineHeight:1 } },
              "PROGRESS",
              React.createElement("br"),
              React.createElement("span", { style:{ color:dayColor } }, "TRACKER")
            )
          ),
          React.createElement("div", { style:{ textAlign:"right" } },
            React.createElement("p", { style:{ fontSize:9, color:C.muted, letterSpacing:"0.2em" } }, "HOY"),
            React.createElement("p", { style:{ fontSize:12, color:"#777", marginBottom:6 } },
              new Date().toLocaleDateString("es-AR",{ weekday:"short", day:"numeric", month:"short" })
            ),
            React.createElement("div", { style:{ display:"flex", gap:5, justifyContent:"flex-end" } },
              React.createElement("button", {
                onClick: () => setWeekNum(w => Math.max(1, w-1)),
                "aria-label": "Semana anterior",
                style:{ fontSize:9, letterSpacing:"0.12em", color:C.muted, cursor:"pointer",
                  border:"1px solid #2a2a2a", borderRadius:4, padding:"3px 8px", background:"none",
                  fontFamily:"inherit" }
              }, "− SEMANA"),
              React.createElement("button", {
                onClick: () => setWeekNum(w => w+1),
                "aria-label": "Semana siguiente",
                style:{ fontSize:9, letterSpacing:"0.12em", color:C.muted, cursor:"pointer",
                  border:"1px solid #2a2a2a", borderRadius:4, padding:"3px 8px", background:"none",
                  fontFamily:"inherit" }
              }, "+ SEMANA")
            )
          )
        )
      ),

      // ══ SESIÓN ══
      React.createElement("div", { className:"fade-in" },
        // Day selector
        React.createElement("div", { style:{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:7, marginBottom:18 } },
          ...DAYS.map(d => {
            const info = ROUTINE[d];
            const active = activeDay===d;
            return React.createElement("button", {
              key:d, onClick: () => changeDay(d),
              "aria-label": `Cambiar a ${d}`,
              style:{ padding:"14px 4px", borderRadius:10, textAlign:"center",
                background: active ? info.color : "#0f0f0f",
                border: active ? "none" : "1px solid #181818",
                color: active ? "#000" : C.muted, cursor:"pointer", transition:"all 0.2s",
                fontFamily:"inherit" }
            },
              React.createElement("div", { style:{ fontFamily:"'Bebas Neue',sans-serif", fontSize:14, letterSpacing:"0.04em" } }, d)
            );
          })
        ),

        // Progress bar
        React.createElement("div", { style:{ marginBottom:18 } },
          React.createElement("div", { style:{ display:"flex", justifyContent:"space-between", marginBottom:5 } },
            React.createElement("span", { style:{ fontSize:9, color:C.muted, letterSpacing:"0.2em" } }, "PROGRESO SESIÓN"),
            React.createElement("span", { style:{ fontSize:9, color:dayColor } }, `${doneSets}/${allSets} SERIES · ${pct}%`)
          ),
          React.createElement("div", { style:{ height:3, background:"#181818", borderRadius:2 } },
            React.createElement("div", { style:{ height:"100%", width:`${pct}%`, background:dayColor, borderRadius:2, transition:"width 0.5s ease" } })
          )
        ),

        // Recordatorio de movilidad, antes de arrancar con los ejercicios
        React.createElement("div", { style:{ display:"flex", alignItems:"center", gap:8, marginBottom:12,
          padding:"9px 12px", background:"#0f0f0f", borderRadius:8, border:`1px solid ${C.border}` } },
          React.createElement("span", { style:{ fontSize:13 } }, "🔄"),
          React.createElement("span", { style:{ fontSize:9, color:C.muted, letterSpacing:"0.2em" } }, "MOVILIDAD ANTES DE EMPEZAR")
        ),

        // Exercises
        React.createElement("div", { style:{ display:"flex", flexDirection:"column", gap:9, marginBottom:12 } },
          ...exercises.map((ex, idx) =>
            React.createElement("div", { key:ex.id, className:"slide-up", style:{ animationDelay:`${idx*0.04}s` } },
              React.createElement(ExerciseCard, {
                ex, color:dayColor, weight:weights[ex.id],
                sessionLog, completedSets,
                onLogSet:handleLogSet, onUndoSet:handleUndoSet, onEditWeight:handleEditWeight,
                onEditName:handleEditName, onToggleType:handleToggleType, onEditUnit:handleEditUnit,
                deload:isDeload
              })
            )
          )
        ),

        // Recordatorio de elongar, al terminar los ejercicios
        React.createElement("div", { style:{ display:"flex", alignItems:"center", gap:8, marginBottom:16,
          padding:"9px 12px", background:"#0f0f0f", borderRadius:8, border:`1px solid ${C.border}` } },
          React.createElement("span", { style:{ fontSize:13 } }, "🧘"),
          React.createElement("span", { style:{ fontSize:9, color:C.muted, letterSpacing:"0.2em" } }, "ELONGAR AL TERMINAR")
        ),

        // Finish button
        doneSets > 0 && React.createElement("button", {
          onClick: finishWorkout,
          "aria-label": `Guardar entrenamiento, ${pct} por ciento completado`,
          style:{ width:"100%", padding:15, borderRadius:12, fontSize:11,
            letterSpacing:"0.3em", textTransform:"uppercase",
            background:dayColor, color:"#000", border:"none", cursor:"pointer",
            fontFamily:"inherit", fontWeight:600 }
        }, `GUARDAR ENTRENAMIENTO · ${pct}%`)
      )
    ),

    // ── LOG MODAL ──
    logging && React.createElement(LogModal, {
      ex: logging.ex, setIdx: logging.setIdx,
      color: dayColor, currentWeight: isDeload ? deloadWeightFor(weights[logging.exId]) : weights[logging.exId],
      onConfirm: confirmLog, onClose: () => setLogging(null)
    }),

    // ── TOAST ──
    toast && React.createElement("div", {
      className:"toast-anim",
      role:"status",
      "aria-live":"polite",
      style:{
        position:"fixed", bottom:90, right:14, zIndex:300,
        background: toast.type==="progress" ? "#0d1f0d" : toast.type==="warn" ? "#1f1408" : "#12121f",
        border:`1px solid ${toast.type==="progress" ? "#4ade80" : toast.type==="warn" ? "#f59e0b" : "#6B8EFF"}`,
        borderRadius:10, padding:"11px 14px", maxWidth:260,
        fontSize:11, color: toast.type==="progress" ? "#4ade80" : toast.type==="warn" ? "#f59e0b" : "#aaa", lineHeight:1.4
      }
    }, toast.msg)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  React.createElement(ErrorBoundary, null, React.createElement(App))
);

// Se desregistra cualquier service worker/caché vieja que haya quedado de una
// versión anterior de esta misma app (causa típica de "andaba bien y ahora
// se rompió" en una PWA: queda sirviendo JS viejo cacheado). Si en el futuro
// se quiere volver a habilitar soporte offline, hay que registrar un sw.js
// nuevo con su propio versionado de caché.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(reg => reg.unregister());
  }).catch(() => {});
}
if (window.caches && caches.keys) {
  caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
}
</script>
